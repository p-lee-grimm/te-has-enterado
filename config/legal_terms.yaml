# Закрытый словарь процессуальных формулировок.
# Свободная формулировка статуса запрещена — только выбор отсюда.
# Проверить с юристом: этот файл несёт основную часть юридического риска.

- es: denuncia presentada
  ru: "подана жалоба в связи с {case}"
  stage: 1

- es: investigado
  ru: "фигурирует в расследовании по делу {case}"
  stage: 2
  note: >
    НЕ «обвиняемый». Термин ввели в 2015 взамен imputado именно из-за
    стигматизации: человек на этой стадии формально ещё ни в чём не обвинён.

- es: imputado
  ru: "фигурирует в расследовании по делу {case}"
  stage: 2
  note: устаревший термин, отображается так же, как investigado

- es: procesado
  ru: "против него ведётся уголовное дело по делу {case}"
  stage: 3

- es: acusado
  ru: "обвиняется по делу {case}"
  stage: 4

- es: juicio oral
  ru: "по делу {case} идёт судебное разбирательство"
  stage: 5

- es: condenado (no firme)
  ru: "осуждён по делу {case}, приговор не вступил в силу"
  stage: 6
  note: >
    Обжалуемый приговор не вступил в силу. «Осуждён» без оговорки —
    фактическая ошибка, а не стилистическая неточность.

- es: condenado (firme)
  ru: "осуждён по делу {case}"
  stage: 7

- es: absuelto
  ru: "оправдан по делу {case}"
  stage: 7
  outcome: true

- es: archivado / sobreseído
  ru: "дело {case} в отношении него прекращено"
  stage: 7
  outcome: true

- es: indultado
  ru: "помилован по делу {case}"
  stage: 8
  outcome: true
