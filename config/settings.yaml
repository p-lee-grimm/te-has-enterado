# Все пороги, веса и лимиты живут здесь. В коде магических чисел быть не должно.

http:
  # User-Agent честный, с контактом — требование §5.6
  user_agent: "QuePasaBot/0.1 (+https://github.com/quepasa-digest; contact: ${CONTACT_EMAIL})"
  timeout_seconds: 15
  retries: 2
  max_concurrency: 12
  # вежливость к одному хосту: издание со 130 статьями в фиде иначе получает
  # 130 запросов подряд и начинает отвечать ошибками
  max_concurrency_per_host: 3
  per_host_delay_seconds: 0.3
  respect_robots_txt: true

fetch:
  # окно, за пределами которого записи фида игнорируются
  max_article_age_hours: 48

normalize:
  # ниже этого порога считаем, что полный текст не достали (пейволл/заглушка)
  min_body_chars: 400
  body_fetch_enabled: true
  # сколько символов тела максимум храним
  max_body_chars: 40000
  # §5.4 — полный текст живёт не дольше этого
  body_retention_hours: 72

embed:
  provider: voyage           # voyage | openai | cohere | local (офлайн-заглушка)
  # voyage-4: 200 млн токенов бесплатной квоты (у voyage-3.5 она исчерпана).
  # При нашем потоке ~7 млн/мес квоты хватит года на два.
  model: voyage-4
  dimensions: 1024
  # эмбеддинг считается по title + первые N символов текста
  body_chars: 1500
  # крупнее пачка — меньше запросов, а лимит у провайдеров именно на запросы.
  # Потолок сверху — лимит токенов в одном запросе, не число текстов.
  batch_size: 256
  # Лимиты провайдера — упереться можно в любой, поэтому считаем оба.
  # Тариф с картой: 2000 запросов и 3 млн токенов в минуту.
  # На бесплатном было 3 и 10000 — если вернёшься туда, поставь их обратно,
  # иначе стадия будет ловить 429.
  requests_per_minute: 2000
  tokens_per_minute: 3000000
  # потолок одного запроса у voyage — 120k токенов; берём с запасом
  max_tokens_per_request: 60000
  # измерено на реальных испанских текстах: 3.41 символа на токен.
  # Берём с запасом вниз — занижать оценку токенов нельзя, упрёмся в лимит.
  chars_per_token: 3.2
  retries: 5
  retry_backoff_seconds: 20
  # Сколько дней держать вектор. Он нужен для кластеризации (окно 48 ч) и для
  # калибровки порога по корпусу; дальше это мёртвый вес — 4 КБ на статью,
  # то есть почти весь объём базы. Затирается `run.py --purge-embeddings`.
  keep_embeddings_days: 14

cluster:
  sim_threshold: 0.82        # калибруется scripts/tune_threshold.py
  window_hours: 48           # CLUSTER_WINDOW_HOURS
  idle_hours: 36             # CLUSTER_IDLE_HOURS

# Политическая шкала. Значение проставляет владелец руками (§2 основной спеки),
# автоклассификации нет. Числа нужны для размаха span = max − min.
#
# Спека v2 предполагала шкалу −2…+2, но меток семь, а не пять: сжатие
# схлопнуло бы far-left с left и right с far-right. Держим −3…+3 и
# компенсируем весом W_SPAN.
lean_scale:
  far-left: -3
  left: -2
  center-left: -1
  center: 0
  center-right: 1
  right: 2
  far-right: 3

# Бакеты для веток допуска: отрицательное — левое, ноль — центр, положительное —
# правое. Задаётся здесь, а не выводится в коде по месту (§13.4).
lean_bucket:
  left_max: -1      # значения <= этого попадают в бакет left
  right_min: 1      # значения >= этого попадают в бакет right
  # всё между ними — center

rank:
  # score = (n_owners + w_span × span) × exp(−Δt / half_life)
  # При шкале −3…+3 максимальный span = 6, то есть пара крайних флангов даёт
  # 2 + 1.5×6 = 11, а шесть изданий одного лагеря — 6. Подтверждение
  # идеологическим оппонентом весит больше, чем ещё одно издание своего лагеря.
  w_span: 1.5
  half_life_hours: 12

  # Веса старой линейной модели (§3.6 основной спеки). Оставлены для
  # совместимости со стадией rank дневного дайджеста.
  weights:
    n_sources: 3.0
    lean_spread: 2.0
    n_articles: 0.5
    velocity: 1.5
    agency_flag: 1.0
  velocity_window_hours: 6
  recency_half_life_hours: 12

select:
  max_items: 7
  min_items: 4
  min_unique_sources: 3
  # правило повтора
  repeat_min_new_articles: 3
  repeat_min_hours: 72
  # не больше N подряд с одной темой
  max_same_topic_in_row: 3

summarize:
  # anthropic  — по ANTHROPIC_API_KEY, работает и в GitHub Actions
  # claude_cli — через `claude -p` на подписке, без отдельного ключа.
  #              Локально удобнее; в раннере нужен CLAUDE_CODE_OAUTH_TOKEN
  #              из `claude setup-token`.
  provider: claude_cli
  model: haiku
  cli_binary: claude
  cli_timeout_seconds: 180
  max_articles_per_cluster: 5
  max_chars_per_article: 3000
  max_tokens: 1200
  temperature: 0.2
  retries: 1
  # цены за миллион токенов, для подсчёта стоимости прогона
  price_per_mtok_in: 1.0
  price_per_mtok_out: 5.0

render:
  telegram_message_limit: 4096
  links_per_item: 3
  timezone: Europe/Madrid

gate:
  min_items: 4
  min_feed_success_ratio: 0.7
  # объём статей за сутки не ниже доли от медианы за N дней
  volume_median_days: 14
  min_volume_ratio: 0.4
  url_check_enabled: true
  url_check_max_status: 400
  # 403/429 отдают издания с антибот-защитой (El País отвечает так и на HEAD,
  # и на GET, хотя в браузере страница открывается). Это не битая ссылка, и
  # ронять из-за неё выпуск нельзя — иначе важнейший источник делает продукт
  # непубликуемым. Логируем, но не считаем провалом. 404/410/5xx — провал.
  url_check_tolerated_statuses: [403, 429]
  # скользящее окно для проверки на скрытое цитирование
  plagiarism_window_words: 10
  # §5.3 — пересказ не длиннее 4 предложений
  max_summary_sentences: 4

publish:
  review_mode: true
  review_timeout_hours: 3
  # насколько поздно после назначенной минуты запуск ещё считается «тем самым»
  schedule_tolerance_minutes: 25
  run_hour_local: 19
  run_minute_local: 30

# Правило автопостинга: какой сюжет достоин отдельного поста.
# Цифры в комментариях — замер на корпусе за 47 ч (scripts/stats.py).
autopost:
  # Пока выключено: сначала посмотри, что правило отбирает, командой
  #   python run.py --autopost            (сухой прогон, ничего не публикует)
  enabled: false

  # Сколько разных изданий должно написать. 2 -> ~25 постов/сутки,
  # 3 -> ~10, 5 -> ~1.5. Три — разумный компромисс.
  min_sources: 3

  # Сколько разных позиций спектра должно быть представлено.
  # 2 отсекает сюжеты, которые заметило только одно крыло.
  # Условия объединяются по ИЛИ: достаточно выполнить любое.
  #   левое + правое                          — 22 сюжета за 47 ч
  #   (левое или правое) + центристское       — 27
  #   min_sources источников                  — 20
  #   вместе (без двойного счёта)             — 42, то есть ~21 в сутки
  rules:
    left_and_right: true
    side_and_center: true
    min_sources: true
  # что считать «левым» и «правым». Узко — только left/far-left и right/far-right;
  # при нынешнем составе источников это почти всегда пусто, потому широко.
  lean_groups_broad: true

  # Рубрики, которые каждое издание выпускает ежедневно: лотереи, гороскопы,
  # результаты розыгрышей. Формально они проходят любую ветку допуска — их
  # печатают все и со всех флангов, — но новостью не являются и в замере
  # занимали три поста в сутки из двадцати.
  exclude_title_patterns:
    - "(?i)\\b(loter[íi]a|sorteo|bonoloto|primitiva|quiniela|euromillones|eurodreams)\\b"
    - "(?i)\\bcup[óo]n\\b"
    - "(?i)\\bhor[óo]scopo\\b"
    - "(?i)comprobar.*(resultado|sorteo|n[úu]mero)"
    - "(?i)\\b(el gordo|la grossa)\\b"

  # Дать сюжету дозреть, прежде чем публиковать. Медиана до 3-го источника —
  # 1.5 ч, но 90% укладываются в 15 ч, так что долго ждать смысла нет:
  # пост всё равно дополняется автоматически (--sync-posts).
  min_age_minutes: 30

  # Окно публикации по Мадриду: прогоны только внутри него.
  window_from_hour: 9
  window_to_hour: 21

  # Потолок в сутки. Считается СКОЛЬЗЯЩИМ окном 24 часа, а не календарным днём:
  # иначе полночь становится дырой, куда можно высыпать двойную норму.
  max_posts_per_day: 25
  # За один прогон. Между постами внутри прогона выдерживается пауза,
  # чтобы канал не выдавал очередь залпом.
  max_posts_per_run: 2
  min_gap_minutes: 20
  # Повтор сюжета. Условия соединены И: и накопилось нового, и прошло время.
  # Иначе живой сюжет лез бы в канал каждый час либо возвращался бы без
  # единого нового материала.
  repeat_min_new_articles: 3
  repeat_min_hours: 12

  # Окно повышения: сколько сюжет остаётся кандидатом, не набрав источников.
  promotion_window_hours: 4
  # Утренний пересмотр: в прогоне этого часа сюжеты, начавшиеся вчера после
  # morning_review_from_hour, проверяются заново независимо от окна.
  morning_review_hour: 9
  morning_review_from_hour: 17

  # Окно смысловой правки: столько после публикации сверяем факты с
  # источниками. Дальше пост считается устоявшимся.
  edit_window_hours: 12

  # Окно правки опубликованного поста. Дальше он замораживается: правка
  # суточной давности читателю ничего не даёт, а расход API и риск задеть
  # текст остаются.
  link_window_hours: 24

  # Ссылок в посте. По одной на владельца: три газеты одного холдинга
  # подтверждают одно и то же и одной ссылкой и остаются.
  max_links_per_post: 5
  # Резерв на вечер: до evening_from_hour расходуется не больше этого.
  # Без резерва тринадцать прогонов выберут квоту к полудню, и крупная
  # вечерняя новость останется без поста.
  max_posts_before_evening: 16
  evening_from_hour: 17

  # Звук. Почти всё уходит беззвучно: два десятка уведомлений в сутки —
  # это отписки. Громким делаем только крупный сюжет и не чаще квоты.
  sound:
    enabled: true
    # Вечерний пост со звуком СВЕРХ этой квоты (решение владельца),
    # то есть в сутки максимум max_per_day + 1 уведомление.
    # Порог решает, сколько уведомлений выйдет на самом деле, а потолок
    # только страхует от всплеска:
    #   min_sources: 5 -> ~1.5 громких в сутки (потолок почти не срабатывает)
    #   min_sources: 4 -> ~4.6 в сутки, то есть упирается в потолок каждый день
    # Основной критерий — скор выше перцентиля за период: подстраивается
    # под поток сам. Пока постов мало, работает запасной порог по изданиям.
    percentile: 0.95
    percentile_days: 30
    # меньше этого постов в истории — перцентиль это шум
    percentile_min_posts: 20
    min_sources: 5
    max_per_day: 3

# Замерный режим (§10): раз в неделю карточки выходят кнопками, чтобы
# посчитать, трогают ли контекст вообще. Пересланный пост кнопок не
# сохраняет, поэтому замерные выпуски НЕДООЦЕНИВАЮТ охват и с обычными
# по вовлечённости не сравнимы.
measure:
  enabled: false
  weekday: 2          # 0=понедельник … 2=среда

# Связанные сюжеты — строка «Ранее по теме» (§4.2).
related:
  enabled: true
  # Заведомо ниже порога склейки: выше — это был бы тот же кластер.
  sim_threshold: 0.70
  window_days: 120
  headline_chars: 70

# Контекстный слой: карточки сущностей (§7.5).
entities:
  # Больше двух карточек превращают пост в справочник.
  max_cards_per_post: 2
  # Одну и ту же сущность не объясняем чаще этого: читатель уже видел.
  explain_cooldown_days: 35
  # О скольких упоминаниях сообщать в чат ревью. Единица намеренно: порог
  # считает повторы, а отличить «разовое имя» от «первого упоминания министра»
  # он не умеет. Óscar Puente и Javier Negre вышли в пост с count = 1 и при
  # пороге 2 не попали бы в очередь никогда. Цена ошибок несимметрична: лишняя
  # строка в чате ревью — это строка, а пропущенное имя — уже опубликованный
  # пост, в котором читатель не понимает, кто действующие лица.
  # Очередь наполняется только именами из вышедших постов, не из всего потока.
  notify_min_count: 1

# Дайджест: всё, что не прошло в отдельный пост, одним постом по категориям.
digest:
  enabled: true
  # Порог для попадания в дайджест. 2 — принципиальный минимум: один источник
  # это не общая повестка (§3.7), а поток одиночек — это ~300 материалов
  # в сутки уровня «коктейли в Аликанте». Поставишь 1 — получишь их все.
  min_sources: 2
  # официальные источники (BOE) в дайджест не тащим: это первоисточник
  # для фактуры, а не новость
  exclude_source_types: [official]
  # потолок строк; берём лучшие по скору
  max_lines: 12
  max_items: 25
  # Сюжету моложе этого ещё может достаться собственный пост — в «Коротко»
  # он попадёт только после того, как шанс использован.
  min_age_hours: 6
  # Не влезшее сегодня участвует в завтрашнем вечернем посте, но не дольше:
  # позавчерашняя мелочь уже не новость.
  max_age_hours: 30
  # Доля мировых сюжетов: иначе в живой мировой день «Коротко» перестаёт
  # быть про Испанию.
  max_world: 4
  # Меньше этого строк — вечерний пост не публикуется вовсе.
  min_lines: 3
  # категория меньше этого сливается в блок «Прочее»
  min_items_per_category: 1
  # Ссылок в строке. Строка со всеми источниками крупного сюжета — это около
  # тысячи символов, и пост перестаёт влезать в лимит Telegram (4096).
  # Берём края спектра: они показывают охват, середина добавляет только длину.
  links_per_item: 2
  # Блок «Главное за сегодня»: ссылки на собственные посты канала за сутки.
  # Ведут внутрь канала, а не на издания — иначе блок дублирует «Коротко».
  main_items: 3
  main_headline_chars: 60
  # Не влезло в одно сообщение — уходит цепочкой реплаев на первое.
  # Дальше этого числа лишние пункты отбрасываются: четыре сообщения
  # подряд вечером это стена, а не дайджест.
  max_messages: 3
  # час публикации дайджеста по Мадриду
  run_hour_local: 21
  run_minute_local: 30
  # Вечерний пост — единственное регулярное уведомление канала.
  # Не входит в квоту autopost.sound.max_per_day.
  with_sound: true

# Издания, попросившие исключить себя (§5.7). Отключаются немедленно.
blocked_sources: []
