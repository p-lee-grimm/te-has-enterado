# Закрытый словарь гео-тегов. LLM выбирает ТОЛЬКО отсюда; значение вне словаря
# отбрасывается на валидации и пишется в лог. Свободный ввод запрещён — иначе
# за месяц появятся #валенсия, #Валенсия и #comunidad_valenciana как три тега.
#
# Один уровень гранулярности — автономные сообщества (17 + Сеута и Мелилья).
# Провинции не заводим: #Аликанте и #Валенсия в одной ленте создают
# неразрешимый вопрос, куда класть новость про весь регион.
#
# Составные названия — camel case без разделителей: дефис и пробел обрывают
# хэштег, и #Кастилия-Ла-Манча превратилось бы в #Кастилия.
