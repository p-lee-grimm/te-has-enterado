# Единственный workflow в репозитории. Расписание живёт на сервере
# (см. bin/ и README): два независимых планировщика на один канал означали бы
# дубли постов и гонку за квоту.
name: Тесты

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q
