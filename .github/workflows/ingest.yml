name: Сбор и кластеризация

on:
  # Каждый час: фиды обновляются непрерывно, а кластер должен успеть
  # дозреть до окна публикации.
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          python run.py --migrate
          python run.py --stage ingest  --commit
          python run.py --stage embed   --commit
          python run.py --stage cluster --commit
          python run.py --stage rank    --commit

      - name: Уборка
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # §5.4 — полный текст живёт не дольше 72 часов;
        # векторы старше двух недель занимают почти всю базу
        run: |
          python run.py --purge-bodies
          python run.py --purge-embeddings --commit
